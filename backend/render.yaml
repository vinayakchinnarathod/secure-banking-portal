services:
  # Backend Service
  - type: web
    name: securebank-backend
    env: java
    plan: free
    buildCommand: "mvn clean package -DskipTests"
    startCommand: "java -jar target/secure-bank-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AUTOKYC_BASE_URL
        value: ${AUTOKYC_BASE_URL}
      - key: SPRING_PROFILES_ACTIVE
        value: prod

databases:
  # PostgreSQL Database
  - name: securebank-db
    databaseName: secure_bank
    user: securebank_user
