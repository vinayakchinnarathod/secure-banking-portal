[build]
  builder = "NIXPACKS"

[deploy]
  startCommand = "java $JAVA_OPTS -jar target/secure-bank-0.0.1-SNAPSHOT.jar"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 100
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[env]
  JAVA_VERSION = "17"
  SPRING_PROFILES_ACTIVE = "prod"
