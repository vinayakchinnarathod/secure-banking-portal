# Production Database Configuration (MySQL)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/secure_bank}
spring.datasource.username=${DATABASE_USERNAME:bankuser}
spring.datasource.password=${DATABASE_PASSWORD:bankpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Configuration
server.port=${PORT:8080}

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey}
jwt.expiration=86400000

# CORS Configuration (allow all origins in production)
spring.web.cors.allowed-origins=${CORS_ORIGINS:*}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Auto-KYC Configuration
autokyc.base-url=${AUTOKYC_BASE_URL:http://localhost:8000/api}
autokyc.enabled=true
autokyc.timeout=30000
autokyc.confidence-threshold=0.85

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.com.bank.securebank=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
