version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: securebank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: secure_bank
      MYSQL_USER: bankuser
      MYSQL_PASSWORD: bankpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-setup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bank-network

  # Java Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securebank-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/secure_bank
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      AUTOKYC_BASE_URL: http://auto-kyc:8000/api
      SPRING_WEB_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - auto-kyc
    networks:
      - bank-network

  # Python Auto-KYC Service
  auto-kyc:
    build:
      context: ./auto-kyc
      dockerfile: Dockerfile
    container_name: securebank-auto-kyc
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./auto-kyc/temp_imgs:/app/temp_imgs
    networks:
      - bank-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securebank-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
      - REACT_APP_KYC_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bank-network

volumes:
  mysql_data:

networks:
  bank-network:
    driver: bridge
